<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Untold Emotions</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet" />
<style>
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at 20% 20%, #0d0d1f, #000);
    color: #fff;
    overflow-x: hidden;
    min-height: 100vh;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    text-align: center;
    font-size: 2.5rem;
    margin-top: 1rem;
    color: #d1d1ff;
    letter-spacing: 1px;
  }

  .container {
    text-align: center;
    margin: 2rem auto;
  }

  textarea {
    width: 80%;
    max-width: 500px;
    height: 80px;
    border: none;
    border-radius: 12px;
    padding: 1rem;
    font-size: 1rem;
    font-family: 'Inter', sans-serif;
    outline: none;
    resize: none;
  }

  button {
    margin-top: 1rem;
    padding: 0.5rem 1.2rem;
    border: none;
    border-radius: 8px;
    background: #3a3aff;
    color: white;
    font-size: 1rem;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background: #5c5cff;
  }

  .messages {
    position: relative;
    height: 70vh;
    overflow: hidden;
  }

  .message {
    position: absolute;
    max-width: 200px;
    padding: 1rem;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(8px);
    filter: blur(5px);
    transition: filter 0.4s ease;
    cursor: pointer;
  }

  .message:hover {
    filter: blur(0);
  }

  canvas#stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>
<h1>Untold Emotions</h1>

<div class="container">
  <textarea id="messageInput" placeholder="Write your untold thought..."></textarea><br/>
  <button id="postButton">Post</button>
</div>

<div class="messages" id="messagesContainer"></div>

<script>
const BIN_ID = "68e3c686d0ea881f40974ec8";
const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;
const PUT_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

async function fetchMessages() {
  const res = await fetch(API_URL);
  const data = await res.json();
  return data.record.messages || [];
}

async function saveMessage(newMessage) {
  const messages = await fetchMessages();
  messages.push({ text: newMessage, time: Date.now() });

  await fetch(PUT_URL, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ messages })
  });

  displayMessages(messages);
}

function displayMessages(messages) {
  const container = document.getElementById("messagesContainer");
  container.innerHTML = "";
  const shuffled = messages.sort(() => 0.5 - Math.random());

  shuffled.forEach(msg => {
    const div = document.createElement("div");
    div.className = "message";
    div.textContent = msg.text;

    // Random floating positions
    div.style.top = Math.random() * 70 + "%";
    div.style.left = Math.random() * 80 + "%";
    div.addEventListener("click", () => {
      div.style.filter = div.style.filter === "blur(0px)" ? "blur(5px)" : "blur(0px)";
    });

    container.appendChild(div);
  });
}

document.getElementById("postButton").addEventListener("click", async () => {
  const input = document.getElementById("messageInput");
  if (input.value.trim()) {
    await saveMessage(input.value.trim());
    input.value = "";
  }
});

// star background animation
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const stars = Array.from({length: 100}, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  r: Math.random() * 1.5,
  s: Math.random() * 0.5
}));

function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#fff';
  stars.forEach(star => {
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.r, 0, 2 * Math.PI);
    ctx.fill();
    star.y += star.s;
    if (star.y > canvas.height) star.y = 0;
  });
  requestAnimationFrame(drawStars);
}
drawStars();

fetchMessages().then(displayMessages);
</script>

</body>
</html>
